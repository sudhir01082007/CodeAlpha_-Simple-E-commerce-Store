<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CodeAlpha Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--gray-50);">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🛍️</span>
        <span>CodeAlpha<span style="color: var(--primary);">Store</span></span>
      </a>

      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="products.html" class="nav-link">Shop Products</a></li>
          <li><a href="cart.html" class="nav-link">Cart</a></li>
          <li><a href="orders.html" class="nav-link">My Orders</a></li>
          <li><a href="profile.html" class="nav-link">Profile</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-btn" title="View Cart">
          🛒
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">
          ☰
        </button>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Register securely with bcrypt password hashing</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type your password" required minlength="6">
        </div>

        <button type="submit" id="btn-register-submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1rem;">
          Register Account &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In here</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
